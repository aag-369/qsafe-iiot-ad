name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r web/requirements.txt -r demo/requirements.txt

      - name: Build liboqs (BIKE-L1 + HQC-128)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          bash scripts/setup_liboqs.sh

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --exit-zero

      - name: Verify KEM cost ordering
        # The adaptive-gating claim inverts if the baseline profile is not
        # cheaper than the hardened one, so this is a hard gate rather than a
        # test assertion buried in the suite.
        run: python scripts/verify_kem_ordering.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke-test the end-to-end pipeline
        run: |
          python -m qkd_sim.qber_stream --out /tmp/ci_stream.csv --rounds 150 --qubits 32 --seed 1
          python -c "
          import pandas as pd
          df = pd.read_csv('/tmp/ci_stream.csv')
          assert len(df) == 150
          assert df['qber'].between(0, 1).all()
          print('QBER stream smoke test OK')
          "

      - name: Smoke-test the deployed entrypoint
        # Boots the exact app Render runs and checks that both surfaces
        # answer, and that the demo's assets resolve under its mount prefix
        # rather than assuming they are served from the root.
        env:
          QSAFE_LINK_DEVICES: "0"
          QSAFE_LINK_IDLE_PAUSE_S: "0"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          import server

          with TestClient(server.app) as c:
              assert c.get('/api/health').status_code == 200, 'dashboard health'

              r = c.get('/link/console')
              assert r.status_code == 200, 'demo console'
              body = r.text
              assert '__BASE__' not in body, 'template placeholder was not substituted'
              assert '/link/static/qsafe.js' in body, 'assets not rooted at the mount prefix'
              assert 'window.QSAFE_BASE = \"/link\"' in body, 'client base prefix missing'

              for path in ('/link/', '/link/node', '/link/monitor'):
                  assert c.get(path).status_code == 200, path

              h = c.get('/link/api/health').json()
              assert h['models_loaded'] is False, 'health check must not force a model load'

              urls = c.get('/link/api/join-urls').json()
              assert urls['console'].endswith('/link/console'), urls
          print('deployed entrypoint smoke test OK')
          "
