name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build liboqs (BIKE-L1 + HQC-128)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          bash scripts/setup_liboqs.sh

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --exit-zero

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke-test the end-to-end pipeline
        run: |
          python -m qkd_sim.qber_stream --out /tmp/ci_stream.csv --rounds 150 --qubits 32 --seed 1
          python -c "
          import pandas as pd
          df = pd.read_csv('/tmp/ci_stream.csv')
          assert len(df) == 150
          assert df['qber'].between(0, 1).all()
          print('QBER stream smoke test OK')
          "
